services:

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override localhost URLs from .env with Docker service names.
      # env_file is read first; environment block takes precedence.
      # MONGO_URI is intentionally NOT overridden here — it points to Atlas
      # (set in backend/.env) and must not be redirected to a local container.
      DATABASE_URL: postgresql+asyncpg://idea_user:idea_pass@postgres:5432/idea_vault_auth
      REDIS_URL: redis://redis:6379
      # Ollama runs on the Mac host, not inside Docker.
      # host.docker.internal resolves to the host machine from within a container.
      LLM_OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    volumes:
      - ./backend:/app          # live-reload in development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      INTERNAL_API_URL: http://backend:8000/api
    depends_on:
      - backend
    networks:
      - app-network

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idea_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idea_pass}
      POSTGRES_DB: ${POSTGRES_DB:-idea_vault_auth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idea_user} -d ${POSTGRES_DB:-idea_vault_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
  

###### this MongoDB service is commented out because we're using MongoDB Atlas for the vector search feature, 
###### But you can uncomment and use it for local development if desired. Just remember to update the MONGO_URI in the .env file accordingly. ######
