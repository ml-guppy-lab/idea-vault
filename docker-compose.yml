services:

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override localhost URLs from .env with Docker service names.
      # env_file is read first; environment block takes precedence.
      DATABASE_URL: postgresql+asyncpg://idea_user:idea_pass@postgres:5432/idea_vault_auth
      MONGO_URI: mongodb://idea_user:idea_pass@mongo:27017/idea_vault?authSource=admin
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app          # live-reload in development
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      INTERNAL_API_URL: http://backend:8000/api
    depends_on:
      - backend
    networks:
      - app-network

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idea_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idea_pass}
      POSTGRES_DB: ${POSTGRES_DB:-idea_vault_auth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idea_user} -d ${POSTGRES_DB:-idea_vault_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ── MongoDB ───────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-idea_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-idea_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-idea_vault}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  app-network:
    driver: bridge
